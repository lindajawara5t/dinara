<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Hero Slideshow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .hero-test {
            position: relative;
            height: 500px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.7s ease;
        }
        .slide.active {
            opacity: 1;
            z-index: 2;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 3;
        }
        .content {
            position: relative;
            z-index: 4;
            color: white;
            padding: 50px;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .dots {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            gap: 10px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: white;
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .dot.active {
            opacity: 1;
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(255,255,255,0.8);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .nav-btn:hover {
            background: white;
        }
        .prev { left: 20px; }
        .next { right: 20px; }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">🎬 Hero Slideshow Test - Standalone</h2>
        
        <div class="hero-test" id="heroTest">
            <!-- Slides akan dimuat di sini -->
        </div>
        
        <div class="status bg-light mt-3">
            <h5>Status:</h5>
            <div id="statusText">Loading...</div>
        </div>
        
        <div class="mt-3">
            <button class="btn btn-primary" onclick="testConnection()">
                <i class="bi bi-arrow-repeat"></i> Test Koneksi
            </button>
            <button class="btn btn-success" onclick="loadSlides()">
                <i class="bi bi-images"></i> Load Slides
            </button>
        </div>
        
        <div class="mt-4">
            <h5>Checklist:</h5>
            <ul>
                <li id="check-auto">❓ Auto-slide berfungsi</li>
                <li id="check-buttons">❓ Tombol next/prev responsif</li>
            </ul>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        let slides = [];
        let autoSlideInterval = null;
        
        // Data dummy untuk testing
        const dummySlides = [
            {
                id: 1,
                title: 'Slide 1 - Destination Paradise',
                description: 'Tempat wisata yang menakjubkan',
                image_url: 'https://via.placeholder.com/1200x500/FF6B6B/FFFFFF?text=Slide+1',
                is_active: 1
            },
            {
                id: 2,
                title: 'Slide 2 - Mountain Adventure',
                description: 'Petualangan di pegunungan',
                image_url: 'https://via.placeholder.com/1200x500/4ECDC4/FFFFFF?text=Slide+2',
                is_active: 1
            },
            {
                id: 3,
                title: 'Slide 3 - Beach Relaxation',
                description: 'Santai di tepi pantai',
                image_url: 'https://via.placeholder.com/1200x500/45B7D1/FFFFFF?text=Slide+3',
                is_active: 1
            }
        ];

        function testConnection() {
            const status = document.getElementById('statusText');
            status.innerHTML = '<div class="spinner-border spinner-border-sm"></div> Testing...';
            console.log('Testing with dummy slides');
            slides = dummySlides;
            status.innerHTML = '✅ <strong>Test Mode!</strong> Menggunakan 3 dummy slides.';
        }

        function loadSlides() {
            const hero = document.getElementById('heroTest');
            const status = document.getElementById('statusText');
            
            console.log('loadSlides called with', slides.length, 'slides');
            
            // Jika belum ada data, gunakan dummy
            if (slides.length === 0) {
                console.log('No slides yet, using dummy slides');
                slides = dummySlides;
            }
            
            if (!slides || slides.length === 0) {
                status.innerHTML = '⚠️ Tidak ada slideshow.';
                return;
            }
            
            // Filter hanya yang aktif
            const activeSlides = slides.filter(s => s.is_active == 1);
            
            if (activeSlides.length === 0) {
                status.innerHTML = '⚠️ Semua slideshow nonaktif.';
                return;
            }
            
            // Update global slides
            slides = activeSlides;
            currentSlide = 0;
            
            console.log('Rendering', slides.length, 'slides');
            hero.innerHTML = '';
            
            slides.forEach((slide, index) => {
                const div = document.createElement('div');
                div.className = 'slide' + (index === 0 ? ' active' : '');
                div.style.backgroundImage = `url('${slide.image_url}')`;
                
                div.innerHTML = `
                    <div class="overlay"></div>
                    <div class="content">
                        <h1>${slide.title || 'Untitled'}</h1>
                        <p>${slide.description || ''}</p>
                    </div>
                `;
                hero.appendChild(div);
                console.log('Added slide', index, ':', slide.title);
            });
            
            // Add navigation
            if (slides.length > 1) {
                console.log('Adding navigation buttons');
                
                // Tombol prev
                const prevBtn = document.createElement('button');
                prevBtn.className = 'nav-btn prev';
                prevBtn.innerHTML = '<i class="bi bi-chevron-left"></i>';
                prevBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Prev button clicked');
                    prevSlide();
                });
                hero.appendChild(prevBtn);
                
                // Tombol next
                const nextBtn = document.createElement('button');
                nextBtn.className = 'nav-btn next';
                nextBtn.innerHTML = '<i class="bi bi-chevron-right"></i>';
                nextBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Next button clicked');
                    nextSlide();
                });
                hero.appendChild(nextBtn);
                
                // Dots container
                const dotsContainer = document.createElement('div');
                dotsContainer.className = 'dots';
                dotsContainer.id = 'dots';
                
                slides.forEach((_, i) => {
                    const dot = document.createElement('div');
                    dot.className = 'dot' + (i === 0 ? ' active' : '');
                    dot.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        console.log('Dot clicked:', i);
                        goToSlide(i);
                    });
                    dotsContainer.appendChild(dot);
                });
                hero.appendChild(dotsContainer);
                
                // Clear any existing auto-slide
                if (autoSlideInterval) clearInterval(autoSlideInterval);
                
                // Mulai auto-slide
                console.log('Starting auto-slide');
                startAutoSlide();
            }
            
            status.innerHTML = `✅ Berhasil memuat ${slides.length} slideshow!`;
            document.getElementById('check-auto').innerHTML = slides.length > 1 ? '✅ Auto-slide berfungsi' : '⚠️ Perlu minimal 2 slide';
            document.getElementById('check-buttons').innerHTML = '✅ Tombol next/prev responsif';
        }

        function goToSlide(index) {
            console.log('goToSlide called:', index, 'current:', currentSlide);
            const slideElements = document.querySelectorAll('.slide');
            const dots = document.querySelectorAll('.dot');
            
            if (slideElements.length === 0) {
                console.log('No slide elements found');
                return;
            }
            
            slideElements[currentSlide].classList.remove('active');
            if (dots[currentSlide]) dots[currentSlide].classList.remove('active');
            
            currentSlide = index;
            
            slideElements[currentSlide].classList.add('active');
            if (dots[currentSlide]) dots[currentSlide].classList.add('active');
            console.log('Switched to slide:', currentSlide);
        }

        function nextSlide() {
            console.log('nextSlide called, currentSlide:', currentSlide, 'slides.length:', slides.length);
            if (slides.length > 0) {
                goToSlide((currentSlide + 1) % slides.length);
                resetAutoSlide();
            }
        }

        function prevSlide() {
            console.log('prevSlide called, currentSlide:', currentSlide, 'slides.length:', slides.length);
            if (slides.length > 0) {
                goToSlide((currentSlide - 1 + slides.length) % slides.length);
                resetAutoSlide();
            }
        }

        function startAutoSlide() {
            console.log('startAutoSlide called, interval will run every 5 seconds');
            autoSlideInterval = setInterval(() => {
                console.log('Auto-slide tick, currentSlide:', currentSlide);
                if (slides.length > 1) {
                    nextSlide();
                }
            }, 5000);
        }

        function resetAutoSlide() {
            console.log('resetAutoSlide called');
            if (autoSlideInterval) {
                clearInterval(autoSlideInterval);
            }
            startAutoSlide();
        }

        // Auto load on page load
        window.addEventListener('load', () => {
            console.log('Page loaded, starting initialization...');
            testConnection();
            setTimeout(() => {
                console.log('Calling loadSlides after delay');
                loadSlides();
            }, 1000);
        });
    </script>
</body>
</html>
