<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Check Landing Page Structure</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .result { padding: 10px; margin: 10px 0; border-left: 4px solid #333; }
        .ok { background: #e8f5e9; border-left-color: #4caf50; }
        .error { background: #ffebee; border-left-color: #f44336; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Landing Page Structure Check</h1>
    
    <div id="results"></div>

    <script>
    const results = document.getElementById('results');
    
    async function checkLandingPage() {
        try {
            // Fetch landing page HTML
            const response = await fetch('http://localhost:8080/dinara/');
            const html = await response.text();
            
            // Check for hero slides
            const heroSlideMatches = html.match(/class="hero-slide/g) || [];
            const hasHeroSection = html.includes('id="heroSlider"') || html.includes('hero-section');
            const hasHeroScript = html.includes('function slideHero');
            const hasAutoPlay = html.includes('resetHeroTimeout');
            const slideCount = heroSlideMatches.length;
            
            addResult('✅ Landing page fetched', true);
            addResult(`Found ${slideCount} .hero-slide elements`, slideCount > 0);
            addResult(`Has hero-section/heroSlider`, hasHeroSection);
            addResult(`Has slideHero function`, hasHeroScript);
            addResult(`Has auto-play logic`, hasAutoPlay);
            
            if (slideCount > 0) {
                addResult(`✅ Total slides: ${slideCount}`, true);
                
                // Extract slide data
                const slidePattern = /data-duration="(\d+)"/g;
                const durations = [];
                let match;
                while ((match = slidePattern.exec(html)) !== null) {
                    durations.push(parseInt(match[1]));
                }
                
                if (durations.length > 0) {
                    addResult(`Slide durations: ${durations.join(', ')} ms`, true);
                }
            } else {
                addResult('❌ No .hero-slide elements found!', false);
            }
            
        } catch (err) {
            addResult(`❌ Error: ${err.message}`, false);
        }
    }
    
    function addResult(text, isOk) {
        const div = document.createElement('div');
        div.className = `result ${isOk ? 'ok' : 'error'}`;
        div.textContent = text;
        results.appendChild(div);
    }
    
    checkLandingPage();
    </script>
</body>
</html>
