<!DOCTYPE html>
<html>
<head>
    <title>Hero Slideshow Debug</title>
    <style>
        body { font-family: Arial; margin: 0; padding: 20px; background: #1a1a1a; color: white; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { background: #2a2a2a; padding: 20px; margin: 20px 0; border-radius: 8px; border-left: 4px solid #0d6efd; }
        .code { background: #0a0a0a; padding: 15px; border-radius: 5px; font-family: monospace; font-size: 0.9rem; overflow-x: auto; max-height: 300px; overflow-y: auto; }
        .success { color: #51cf66; }
        .error { color: #ff6b6b; }
        .warning { color: #ffd43b; }
        .hero-preview {
            margin: 20px 0;
            min-height: 400px;
            background: #0a0a0a;
            border: 2px solid #555;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s; }
        .slide.active { opacity: 1; }
        .slide-img { width: 100%; height: 100%; background-size: cover; background-position: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Hero Slideshow Debug Page</h1>
        
        <div class="section">
            <h2>1. Database Check</h2>
            <div id="db-check" class="code">Loading...</div>
        </div>
        
        <div class="section">
            <h2>2. HTML Render Check</h2>
            <div id="html-check" class="code">Loading...</div>
        </div>
        
        <div class="section">
            <h2>3. Live Hero Preview</h2>
            <div class="hero-preview" id="hero-preview">
                <div style="position: relative; z-index: 1; height: 100%; display: flex; align-items: center; justify-content: center;">
                    <div style="text-align: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
                        <h2>Hero Background Preview</h2>
                        <p>(Background berubah setiap 5 detik)</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2>4. JavaScript Check</h2>
            <div id="js-check" class="code">
                <p><span class="warning">⏳</span> Checking...</p>
            </div>
        </div>
        
        <div class="section">
            <h2>5. Troubleshooting</h2>
            <button onclick="testSlideshow()">Test Slideshow</button>
            <button onclick="location.reload()">Reload Page</button>
            <div id="test-output" class="code" style="margin-top: 15px;"></div>
        </div>
    </div>
    
    <script>
        // Check database
        fetch('<?= base_url("debug/slideshow") ?>')
            .then(r => r.json())
            .then(data => {
                const el = document.getElementById('db-check');
                if (data.total > 0) {
                    el.innerHTML = `<span class="success">✅ Found ${data.total} slides</span>\n${JSON.stringify(data.slides, null, 2)}`;
                } else {
                    el.innerHTML = `<span class="error">❌ No slides found</span>`;
                }
            })
            .catch(e => {
                document.getElementById('db-check').innerHTML = `<span class="error">❌ Error: ${e.message}</span>`;
            });
        
        // Check HTML
        window.addEventListener('load', function() {
            const container = document.querySelector('[id="slideshow-bg-container"]') || document.querySelector('.slideshow-background-container');
            const slideBgs = document.querySelectorAll('.slide-bg');
            const heroSection = document.querySelector('.hero-section-with-slideshow');
            
            let htmlOutput = '';
            if (container) {
                htmlOutput += `<span class="success">✅ Slideshow container found</span>\n`;
            } else {
                htmlOutput += `<span class="error">❌ Slideshow container NOT found</span>\n`;
            }
            
            htmlOutput += `Slide elements: <span class="${slideBgs.length > 0 ? 'success' : 'error'}">${slideBgs.length}</span>\n`;
            htmlOutput += `Hero section: <span class="${heroSection ? 'success' : 'error'}">${heroSection ? 'found' : 'NOT found'}</span>\n`;
            
            if (slideBgs.length > 0) {
                htmlOutput += `\nFirst slide:\n`;
                const first = slideBgs[0];
                htmlOutput += `  Classes: ${first.className}\n`;
                const bgImage = window.getComputedStyle(first.querySelector('.slide-bg-image')).backgroundImage;
                htmlOutput += `  Background Image: ${bgImage}\n`;
            }
            
            document.getElementById('html-check').innerHTML = htmlOutput;
            
            // Try to render preview
            renderPreview();
        });
        
        function renderPreview() {
            fetch('<?= base_url("debug/slideshow") ?>')
                .then(r => r.json())
                .then(data => {
                    if (data.total === 0) return;
                    
                    const preview = document.getElementById('hero-preview');
                    const slidesHtml = data.slides.map((slide, i) => `
                        <div class="slide ${i === 0 ? 'active' : ''}">
                            <div class="slide-img" style="background-image: url('<?= base_url('') ?>${slide.image_url}')"></div>
                        </div>
                    `).join('');
                    
                    preview.innerHTML = slidesHtml + `
                        <div style="position: relative; z-index: 1; height: 100%; display: flex; align-items: center; justify-content: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
                            <div style="text-align: center; color: white;">
                                <h2>Preview: ${data.total} slides</h2>
                            </div>
                        </div>
                    `;
                    
                    // Auto play
                    let idx = 0;
                    setInterval(() => {
                        const slides = preview.querySelectorAll('.slide');
                        slides.forEach(s => s.classList.remove('active'));
                        idx = (idx + 1) % slides.length;
                        slides[idx].classList.add('active');
                    }, 5000);
                });
        }
        
        function testSlideshow() {
            const output = document.getElementById('test-output');
            const slideBgs = document.querySelectorAll('.slide-bg');
            const heroSection = document.querySelector('.hero-section-with-slideshow');
            
            output.innerHTML = '';
            
            if (!heroSection) {
                output.innerHTML += '<span class="error">❌ Hero section not found</span>\n';
                return;
            }
            
            output.innerHTML += '<span class="success">✅ Hero section found</span>\n';
            output.innerHTML += `Computed styles:\n`;
            const styles = window.getComputedStyle(heroSection);
            output.innerHTML += `  Position: ${styles.position}\n`;
            output.innerHTML += `  Z-index: ${styles.zIndex}\n`;
            output.innerHTML += `  Overflow: ${styles.overflow}\n`;
            output.innerHTML += `  Height: ${styles.height}\n`;
            
            const container = document.querySelector('[id="slideshow-bg-container"]');
            if (container) {
                output.innerHTML += `\n<span class="success">✅ Container found</span>\n`;
                output.innerHTML += `  Children: ${container.children.length}\n`;
                output.innerHTML += `  Computed height: ${window.getComputedStyle(container).height}\n`;
            }
        }
        
        // Check JS loaded
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('js-check').innerHTML = '<span class="success">✅ JavaScript is running</span>';
                testSlideshow();
            }, 1000);
        });
    </script>
</body>
</html>
