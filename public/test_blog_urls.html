<!DOCTYPE html>
<html>
<head>
    <title>Direct URL Blog Test</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .test { padding: 15px; margin: 10px 0; border-radius: 4px; }
        .ok { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #4caf50; }
        .err { background: #ffebee; color: #c62828; border-left: 4px solid #f44336; }
    </style>
</head>
<body>
    <h1>Test Blog Endpoint - Various URLs</h1>
    <div id="results"></div>

    <script>
    const results = document.getElementById('results');
    
    async function testUrl(url, label) {
        try {
            console.log(`Testing: ${url}`);
            const response = await fetch(url);
            const text = await response.text();
            const isJson = text.trim().startsWith('[') || text.trim().startsWith('{');
            
            const div = document.createElement('div');
            div.className = `test ${response.status === 200 && isJson ? 'ok' : 'err'}`;
            div.innerHTML = `
                <strong>${label}</strong><br>
                Status: ${response.status}<br>
                Type: ${isJson ? 'JSON' : 'HTML'}<br>
                First 50 chars: <code>${text.substring(0, 50)}</code>
            `;
            results.appendChild(div);
        } catch (e) {
            const div = document.createElement('div');
            div.className = 'test err';
            div.innerHTML = `<strong>${label}</strong><br>Error: ${e.message}`;
            results.appendChild(div);
        }
    }
    
    // Test different URL formats
    const baseUrl = window.location.origin;
    const dinaraBase = baseUrl + '/dinara';
    
    Promise.all([
        testUrl(dinaraBase + '/blog/all', '✅ CORRECT: Absolute http://localhost:8080/dinara/blog/all'),
        testUrl(baseUrl + '/dinara/blog/all', 'Absolute full path: http://localhost:8080/dinara/blog/all'),
        testUrl('/dinara/blog/all', 'Root path: /dinara/blog/all'),
        testUrl('/blog/all', '❌ WRONG - Root path /blog/all (missing /dinara)'),
        testUrl('./blog/all', 'Relative: ./blog/all (from public folder)'),
    ]);
    </script>
</body>
</html>
