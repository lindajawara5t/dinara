<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Test Slideshow Edit Function</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        .test-box { 
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .ok { background: #e8f5e9; border-left: 4px solid #4caf50; }
        .err { background: #ffebee; border-left: 4px solid #f44336; }
        .warn { background: #fff3e0; border-left: 4px solid #ff9800; }
    </style>
</head>
<body>
    <h1>🔍 Slideshow Edit Function Test</h1>
    
    <div id="results"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    const results = document.getElementById('results');
    
    function addResult(type, title, message) {
        const div = document.createElement('div');
        div.className = `test-box ${type}`;
        div.innerHTML = `<strong>${title}</strong><br>${message}`;
        results.appendChild(div);
    }
    
    // Test 1: Check bootstrap modal
    try {
        if (typeof bootstrap !== 'undefined' && typeof bootstrap.Modal !== 'undefined') {
            addResult('ok', '✅ Bootstrap Modal Available', 'bootstrap.Modal API ready');
        } else {
            addResult('err', '❌ Bootstrap Modal Not Available', 'bootstrap.Modal tidak ter-load');
        }
    } catch (e) {
        addResult('err', '❌ Bootstrap Error', e.message);
    }
    
    // Test 2: Check if editSlideshowModal element exists
    const modal = document.getElementById('editSlideshowModal');
    if (modal) {
        addResult('ok', '✅ Modal Element Exists', 'Element #editSlideshowModal ditemukan');
    } else {
        addResult('err', '❌ Modal Element Missing', 'Element #editSlideshowModal TIDAK ada');
    }
    
    // Test 3: Test fetch to admin/get_slideshows
    fetch('/dinara/admin/get_slideshows')
        .then(r => {
            if (r.ok) {
                addResult('ok', '✅ Endpoint /admin/get_slideshows Accessible', `Status: ${r.status}`);
            } else {
                addResult('err', '❌ Endpoint Error', `Status: ${r.status}`);
            }
            return r.json();
        })
        .then(data => {
            addResult('ok', '✅ Valid JSON Response', `Total slideshows: ${data.length || Object.keys(data).length}`);
        })
        .catch(e => {
            addResult('err', '❌ Fetch Error', e.message);
        });
    
    // Test 4: Simulate editSlideshow call
    console.log('Testing editSlideshow function...');
    addResult('warn', '📋 Simulation', 'Attempting to simulate editSlideshow(1) call...');
    
    // Mock the function first
    if (typeof editSlideshow === 'function') {
        addResult('ok', '✅ editSlideshow Function Exists', 'Function sudah ter-define');
    } else {
        addResult('warn', '⚠️ editSlideshow Not in Scope', 'Function akan ter-define setelah admin page load');
    }
    </script>
</body>
</html>
