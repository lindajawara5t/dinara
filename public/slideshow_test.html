<!DOCTYPE html>
<html>
<head>
    <title>Direct HTML Test</title>
    <style>
        * { margin: 0; padding: 0; }
        body { font-family: Arial; }
        
        .hero {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
        }
        
        .slides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        
        .slide.active {
            opacity: 1;
        }
        
        .slide-img {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }
        
        .slide-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(13, 110, 253, 0.3) 0%, rgba(0, 100, 255, 0.25) 40%, rgba(0, 31, 63, 0.4) 100%);
        }
        
        .content {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .info {
            background: #f0f0f0;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            border-left: 4px solid #0d6efd;
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="slides" id="slides"></div>
        <div class="content">
            <div>
                <h1>Slideshow Test</h1>
                <p id="slide-counter">Loading slides...</p>
            </div>
        </div>
    </div>
    
    <div class="info">
        <h2>Troubleshooting Info:</h2>
        <p>Jika tidak ada background yang berubah:</p>
        <ul>
            <li>Buka DevTools (F12)</li>
            <li>Lihat Console untuk error</li>
            <li>Cek Network untuk image loading</li>
            <li>Lihat Elements > hero > slides</li>
        </ul>
    </div>
    
    <script>
        async function loadSlides() {
            try {
                const response = await fetch('<?= base_url("debug/slideshow") ?>');
                const data = await response.json();
                
                console.log('Slides data:', data);
                
                if (data.total === 0) {
                    document.getElementById('slide-counter').innerText = 'No slides found!';
                    return;
                }
                
                document.getElementById('slide-counter').innerText = `Showing ${data.total} slides (changing every 5s)`;
                
                const slidesContainer = document.getElementById('slides');
                
                data.slides.forEach((slide, idx) => {
                    const slideEl = document.createElement('div');
                    slideEl.className = `slide ${idx === 0 ? 'active' : ''}`;
                    slideEl.innerHTML = `
                        <div class="slide-img" style="background-image: url('<?= base_url('') ?>${slide.image_url}')"></div>
                        <div class="slide-overlay"></div>
                    `;
                    slidesContainer.appendChild(slideEl);
                });
                
                // Auto-rotate
                let currentIdx = 0;
                setInterval(() => {
                    const slides = document.querySelectorAll('.slide');
                    slides.forEach(s => s.classList.remove('active'));
                    currentIdx = (currentIdx + 1) % slides.length;
                    slides[currentIdx].classList.add('active');
                    console.log(`Showing slide ${currentIdx + 1}/${slides.length}`);
                }, 5000);
                
            } catch (err) {
                console.error('Error loading slides:', err);
                document.getElementById('slide-counter').innerText = `Error: ${err.message}`;
            }
        }
        
        loadSlides();
    </script>
</body>
</html>
