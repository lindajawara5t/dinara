<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Embedded Landing Page - Console Capture</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        .landing-wrapper {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .landing-frame {
            width: 100%;
            height: 600px;
            border: none;
        }
        
        .console-panel {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        
        .console-header {
            background: #1e1e1e;
            color: #fff;
            padding: 10px 15px;
            font-weight: bold;
            font-size: 14px;
        }
        
        .console-content {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .console-line {
            margin: 2px 0;
            padding: 2px 0;
        }
        
        .log-info { color: #00ff00; }
        .log-warn { color: #ffff00; }
        .log-error { color: #ff0000; }
        .log-debug { color: #888888; }
        
        h1 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            color: #1565c0;
            font-size: 14px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f5f5f5;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 13px;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #2196f3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>🚀 Landing Page + Console Monitor</h1>
    
    <div class="info-box">
        ℹ️ Buka Console Developer (F12) di landing page untuk lihat real-time messages saat slideshow loading
    </div>
    
    <div class="container">
        <div class="landing-wrapper">
            <iframe class="landing-frame" id="landing-iframe" src="http://localhost:8080/dinara/"></iframe>
        </div>
        
        <div class="console-panel">
            <div class="console-header">🖥️ Console Output (Simulated)</div>
            <div class="console-content" id="console-output">
                <div class="console-line log-debug">Waiting for console messages...</div>
            </div>
        </div>
    </div>

    <script>
    // Capture console dari iframe
    const iframe = document.getElementById('landing-iframe');
    const consoleOutput = document.getElementById('console-output');
    
    let messageCount = 0;
    
    // Intercept console dalam parent window juga
    const originalLog = console.log;
    const originalWarn = console.warn;
    const originalError = console.error;
    
    function addConsoleMessage(type, message) {
        const line = document.createElement('div');
        line.className = `console-line log-${type}`;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        consoleOutput.appendChild(line);
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
        messageCount++;
    }
    
    console.log = function(...args) {
        originalLog.apply(console, args);
        addConsoleMessage('info', args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
    };
    
    console.warn = function(...args) {
        originalWarn.apply(console, args);
        addConsoleMessage('warn', args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
    };
    
    console.error = function(...args) {
        originalError.apply(console, args);
        addConsoleMessage('error', args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
    };
    
    // Try to intercept iframe console too (may be blocked by CORS)
    iframe.onload = function() {
        try {
            const iframeWindow = iframe.contentWindow;
            addConsoleMessage('info', 'iframe loaded - trying to capture console...');
            
            // This likely won't work due to CORS, but worth trying
            const iframeLog = iframeWindow.console.log;
            iframeWindow.console.log = function(...args) {
                iframeLog.apply(iframeWindow.console, args);
                addConsoleMessage('info', '[iframe] ' + args.join(' '));
            };
        } catch (e) {
            addConsoleMessage('warn', 'Cannot intercept iframe console (CORS): ' + e.message);
        }
    };
    
    addConsoleMessage('info', 'Console monitor initialized - Watching for slideshow messages...');
    addConsoleMessage('debug', 'Open iframe developer console (F12) to see detailed logs');
    </script>
</body>
</html>
