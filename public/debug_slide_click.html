<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Debug Slide Click Issue</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .status { padding: 15px; margin: 15px 0; border-radius: 4px; }
        .ok { background: #e8f5e9; border-left: 4px solid #4caf50; color: #2e7d32; }
        .err { background: #ffebee; border-left: 4px solid #f44336; color: #c62828; }
        .warn { background: #fff3e0; border-left: 4px solid #ff9800; color: #e65100; }
        .code { background: #f5f5f5; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; overflow-x: auto; margin: 10px 0; }
        button { padding: 10px 20px; background: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #1976d2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Debug Slide Click Issue</h1>
        
        <div id="results"></div>
        
        <button onclick="checkSlideElements()">🔍 Check Slide Elements</button>
        <button onclick="checkFunction()">⚙️ Check openSlideLink Function</button>
        <button onclick="testManualClick()">🖱️ Test Manual Click</button>
        <button onclick="checkConsole()">📋 Show Console Logs</button>
    </div>

    <script>
    const resultsDiv = document.getElementById('results');
    const consoleLogs = [];
    
    // Capture all console logs
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;
    
    console.log = function(...args) {
        originalLog.apply(console, args);
        consoleLogs.push({ type: 'log', msg: args.join(' ') });
    };
    
    console.error = function(...args) {
        originalError.apply(console, args);
        consoleLogs.push({ type: 'error', msg: args.join(' ') });
    };
    
    console.warn = function(...args) {
        originalWarn.apply(console, args);
        consoleLogs.push({ type: 'warn', msg: args.join(' ') });
    };
    
    function addResult(type, title, message) {
        const div = document.createElement('div');
        div.className = `status ${type}`;
        div.innerHTML = `<strong>${title}</strong><br>${message}`;
        resultsDiv.appendChild(div);
    }
    
    function checkSlideElements() {
        resultsDiv.innerHTML = '';
        
        // Fetch landing page and check for slide elements
        fetch('http://localhost:8080/dinara/')
            .then(r => r.text())
            .then(html => {
                // Check for hero-slide elements
                const slideMatches = html.match(/class="hero-slide[^"]*"/g) || [];
                const slideCount = slideMatches.length;
                
                addResult('ok', '✅ HTML Fetch Success', `Found ${slideCount} slide elements`);
                
                // Check for data-button-url
                const buttonUrlMatches = html.match(/data-button-url="[^"]*"/g) || [];
                addResult(buttonUrlMatches.length > 0 ? 'ok' : 'err', 
                    buttonUrlMatches.length > 0 ? '✅ data-button-url Found' : '❌ data-button-url Missing',
                    `Found ${buttonUrlMatches.length} slides with data-button-url<br><div class="code">${buttonUrlMatches.slice(0, 3).join('<br>')}</div>`
                );
                
                // Check for onclick="openSlideLink
                const clickMatches = html.match(/onclick="openSlideLink\([^)]*\)"/g) || [];
                addResult(clickMatches.length > 0 ? 'ok' : 'err',
                    clickMatches.length > 0 ? '✅ onclick Handler Found' : '❌ onclick Handler Missing',
                    `Found ${clickMatches.length} slides with onclick="openSlideLink(this)"`
                );
                
                // Check for openSlideLink function definition
                const funcDef = html.includes('function openSlideLink') ? 'Found' : 'Not Found';
                addResult(html.includes('function openSlideLink') ? 'ok' : 'err',
                    html.includes('function openSlideLink') ? '✅ openSlideLink Function' : '❌ openSlideLink Function Missing',
                    `Function definition: ${funcDef}`
                );
                
                // Check for cursor:pointer CSS
                const cursorMatches = html.match(/cursor:pointer/g) || [];
                addResult(cursorMatches.length > 0 ? 'ok' : 'warn',
                    cursorMatches.length > 0 ? '✅ Cursor Pointer Set' : '⚠️ Cursor Pointer Not Set',
                    `Found ${cursorMatches.length} instances of cursor:pointer`
                );
            })
            .catch(e => {
                addResult('err', '❌ Fetch Error', e.message);
            });
    }
    
    function checkFunction() {
        resultsDiv.innerHTML = '';
        
        // Check if function is defined on current page
        if (typeof openSlideLink === 'function') {
            addResult('ok', '✅ openSlideLink Function Available', 'Function is defined and accessible');
        } else {
            addResult('err', '❌ openSlideLink Function Not Found', 'Function is not defined in global scope');
        }
        
        // Check if showSection is available
        if (typeof showSection === 'function') {
            addResult('ok', '✅ showSection Function Available', 'Function is defined for JavaScript calls');
        } else {
            addResult('warn', '⚠️ showSection Function Not Found', 'Function might not be available');
        }
        
        // Show function signature
        addResult('ok', 'Function Signature', `<div class="code">function openSlideLink(slideElement) {<br>  const buttonUrl = slideElement.getAttribute('data-button-url');<br>  // ... handle different link types<br>}</div>`);
    }
    
    function testManualClick() {
        resultsDiv.innerHTML = '';
        
        addResult('warn', '🧪 Manual Click Test', 'Testing with mock slide element...');
        
        // Create a mock slide element
        const mockSlide = document.createElement('div');
        mockSlide.className = 'hero-slide';
        mockSlide.setAttribute('data-button-url', "showSection('promo')");
        
        try {
            // Try to call function
            if (typeof openSlideLink === 'function') {
                console.log('Calling openSlideLink with mock element...');
                openSlideLink(mockSlide);
                addResult('ok', '✅ Manual Click Test Passed', 'Function executed without errors. Check console for "🔗 Opening slide link" message.');
            } else {
                addResult('err', '❌ Function Not Available', 'openSlideLink function is not defined');
            }
        } catch (e) {
            addResult('err', '❌ Function Error', `Error: ${e.message}`);
        }
    }
    
    function checkConsole() {
        resultsDiv.innerHTML = '';
        
        if (consoleLogs.length === 0) {
            addResult('warn', '📋 Console Logs', 'No logs captured yet. Run other tests first.');
            return;
        }
        
        let logsHtml = '<div class="code">';
        consoleLogs.forEach(log => {
            const className = log.type === 'error' ? 'style="color: red;"' : log.type === 'warn' ? 'style="color: orange;"' : '';
            logsHtml += `<div ${className}>[${log.type.toUpperCase()}] ${log.msg}</div>`;
        });
        logsHtml += '</div>';
        
        addResult('ok', `📋 Console Logs (${consoleLogs.length})`, logsHtml);
    }
    
    // Run initial checks on load
    window.addEventListener('load', () => {
        console.log('Debug page loaded');
        checkSlideElements();
    });
    </script>
</body>
</html>
