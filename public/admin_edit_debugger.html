<!DOCTYPE html>
<html>
<head>
    <title>Admin Edit Button Debugger</title>
    <style>
        body { font-family: Arial; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        .section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .console-log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.4;
            margin-top: 10px;
        }
        
        .log-line { margin: 2px 0; }
        .info { color: #00ff00; }
        .error { color: #ff0000; }
        .warn { color: #ffff00; }
        
        .button-test {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #2196f3;
            color: white;
            font-weight: bold;
        }
        
        button:hover { background: #1976d2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Admin Edit Button Debugger</h1>
        
        <div class="section">
            <h3>📋 Instructions:</h3>
            <ol>
                <li>Buka admin/settings/slideshow di tab baru</li>
                <li>Klik tombol "Edit" pada salah satu slide</li>
                <li>Console di bawah akan capture semua events dan errors</li>
                <li>Share hasil console untuk debugging</li>
            </ol>
        </div>
        
        <div class="section">
            <h3>🖥️ Capture Console</h3>
            <div class="button-test">
                <button onclick="clearLogs()">Clear Logs</button>
                <button onclick="testEditFunction()">Test editSlideshow(1)</button>
                <button onclick="loadAdminInIframe()">Load Admin Page</button>
            </div>
            <div class="console-log" id="console"></div>
        </div>
        
        <div class="section" id="iframe-section" style="display: none;">
            <h3>📱 Admin Preview</h3>
            <iframe id="admin-frame" style="width: 100%; height: 600px; border: none; border-radius: 4px;"></iframe>
        </div>
    </div>

    <script>
    const consoleDiv = document.getElementById('console');
    const logs = [];
    
    // Override console methods
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;
    
    function addLog(type, message) {
        const line = document.createElement('div');
        line.className = `log-line ${type}`;
        line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        consoleDiv.appendChild(line);
        consoleDiv.scrollTop = consoleDiv.scrollHeight;
        logs.push({ type, message, time: new Date() });
    }
    
    console.log = function(...args) {
        originalLog.apply(console, args);
        addLog('info', '✓ ' + args.join(' '));
    };
    
    console.error = function(...args) {
        originalError.apply(console, args);
        addLog('error', '✗ ' + args.join(' '));
    };
    
    console.warn = function(...args) {
        originalWarn.apply(console, args);
        addLog('warn', '⚠ ' + args.join(' '));
    };
    
    function clearLogs() {
        consoleDiv.innerHTML = '';
        logs.length = 0;
        console.log('Logs cleared');
    }
    
    function testEditFunction() {
        console.log('Testing editSlideshow function...');
        
        // Check if function exists
        if (typeof editSlideshow === 'function') {
            console.log('editSlideshow function FOUND');
            try {
                // Try to call it
                console.log('Calling editSlideshow(1)...');
                editSlideshow(1);
                console.log('editSlideshow(1) called successfully');
            } catch (e) {
                console.error('Error calling editSlideshow:', e.message);
            }
        } else {
            console.warn('editSlideshow function NOT FOUND');
            console.log('Available functions:', Object.keys(window).filter(k => typeof window[k] === 'function').slice(0, 10).join(', '));
        }
    }
    
    function loadAdminInIframe() {
        document.getElementById('iframe-section').style.display = 'block';
        const iframe = document.getElementById('admin-frame');
        iframe.src = 'http://localhost:8080/dinara/admin';
        console.log('Loading admin page in iframe...');
    }
    
    // Setup initial logs
    console.log('Debug console initialized');
    console.log('Window URL:', window.location.href);
    console.log('Open admin page in another tab and click Edit button');
    </script>
</body>
</html>
